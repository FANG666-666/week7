<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App — Yuhao.Fang</title>
  <meta name="description" content="A small city weather app by Yuhao.Fang — search any city to see the current temperature, conditions, and a matching icon." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #f3f8fb;
      --cream-deep: #e5f0f5;
      --peach: #d8ecf3;
      --terracotta: #2f86b0;
      --terracotta-d: #1f6286;
      --honey: #4fb597;
      --sage: #3d8a73;
      --brown: #1d3340;
      --brown-soft: #46606f;
      --muted: #7e97a5;
      --white: #ffffff;
      --error: #b0453a;

      --radius: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --shadow-soft: 0 10px 30px -12px rgba(28, 70, 92, 0.20);
      --shadow-card: 0 16px 40px -18px rgba(28, 70, 92, 0.28);
      --ring: 0 0 0 4px rgba(47, 134, 176, 0.20);

      --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--brown);
      background: var(--cream);
      line-height: 1.6;
      font-size: 17px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--terracotta-d); text-decoration: none; }
    a:hover { color: var(--terracotta); }
    button { font-family: inherit; cursor: pointer; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .wrap {
      width: min(100% - 2rem, 34rem);
      margin-inline: auto;
      padding: 1.25rem 0 3rem;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.5rem 0 1.5rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--brown);
    }
    .brand:hover { color: var(--terracotta-d); }
    .brand .mark {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--honey), var(--terracotta));
      display: grid; place-items: center;
      color: #fff; font-size: 1rem; font-weight: 800;
      flex: none;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--brown-soft);
      background: var(--white);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-soft);
      transition: transform 0.18s ease, color 0.18s ease;
    }
    .back:hover { color: var(--terracotta-d); transform: translateY(-2px); }
    .back svg { width: 16px; height: 16px; flex: none; }

    /* ---------- Card ---------- */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 1.75rem 1.5rem;
    }
    .card h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }
    .card .sub {
      color: var(--brown-soft);
      font-size: 0.98rem;
      margin-bottom: 1.4rem;
    }

    /* ---------- Search form ---------- */
    .search { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .search input {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.85rem 1.15rem;
      border: 2px solid rgba(29, 51, 64, 0.14);
      border-radius: var(--radius-pill);
      background: #fff;
      color: var(--brown);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: var(--terracotta); box-shadow: var(--ring); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.7rem;
      border: 2px solid transparent;
      border-radius: var(--radius-pill);
      background: var(--terracotta);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 10px 22px -10px rgba(31, 98, 134, 0.65);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .btn:hover { background: var(--terracotta-d); transform: translateY(-2px); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn[disabled] { opacity: 0.6; cursor: progress; transform: none; }

    /* ---------- Status message ---------- */
    .status {
      margin-top: 1.15rem;
      min-height: 1.5rem;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--brown-soft);
    }
    .status--loading { color: var(--terracotta-d); animation: pulse 1.1s ease-in-out infinite; }
    .status--error { color: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* ---------- Result ---------- */
    .result { display: none; }
    .result.is-visible { display: block; animation: rise 0.35s ease both; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .reading { display: flex; align-items: center; gap: 1.15rem; }
    .icon {
      width: 88px; height: 88px;
      flex: none;
      padding: 12px;
      border-radius: 50%;
      background: var(--cream-deep);
      color: var(--terracotta);
      display: grid;
      place-items: center;
    }
    .icon svg { width: 100%; height: 100%; display: block; }

    .reading__text { min-width: 0; }
    .temp {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.2rem, 10vw, 2.9rem);
      line-height: 1;
      color: var(--brown);
    }
    .temp small {
      font-size: 0.42em;
      font-weight: 600;
      color: var(--brown-soft);
      margin-left: 0.12em;
      vertical-align: 0.3em;
    }
    .cond {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.35rem;
      line-height: 1.2;
      color: var(--terracotta-d);
      margin-top: 0.3rem;
    }
    .place { font-weight: 800; font-size: 1rem; color: var(--brown); margin-top: 0.35rem; }
    .place .prov { font-weight: 700; font-size: 0.85rem; color: var(--muted); margin-left: 0.45rem; }

    .meta {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.3rem;
      padding-top: 1.15rem;
      border-top: 1px solid rgba(29, 51, 64, 0.08);
    }
    .meta li {
      background: var(--cream-deep);
      color: var(--brown-soft);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-pill);
    }
    .foot { margin-top: 0.85rem; font-size: 0.75rem; color: var(--muted); }

    /* ---------- Mobile ---------- */
    @media (max-width: 430px) {
      .card { padding: 1.4rem 1.15rem; }
      .search input { flex-basis: 100%; }
      .btn { flex: 1 1 100%; }
      .reading { gap: 0.95rem; }
      .icon { width: 72px; height: 72px; padding: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

  <main class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <span class="mark">Y</span>
        Yuhao.Fang
      </a>
      <a class="back" href="projects.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></svg>
        Projects
      </a>
    </div>

    <section class="card">
      <h1>Weather</h1>
      <p class="sub">Type any city to see its current conditions.</p>

      <form class="search" id="search-form" novalidate>
        <label class="sr-only" for="city-input">City name</label>
        <input
          id="city-input"
          name="city"
          type="text"
          placeholder="Enter a city, e.g. Beijing or London"
          autocomplete="off"
          autocapitalize="words"
          enterkeyhint="search"
        />
        <button class="btn" id="search-btn" type="submit">Search</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="result" id="result">
        <div class="reading">
          <div class="icon" id="w-icon" aria-hidden="true"></div>
          <div class="reading__text">
            <div class="temp" id="w-temp"></div>
            <div class="cond" id="w-cond"></div>
            <div class="place"><span id="w-city"></span><span class="prov" id="w-prov"></span></div>
          </div>
        </div>
        <ul class="meta" id="w-meta"></ul>
        <p class="foot" id="w-foot"></p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var ENDPOINT = 'https://uapis.cn/api/v1/misc/weather';

      var MSG_EMPTY = 'Enter a city first.';
      var MSG_NOT_FOUND = 'Couldn\u2019t find that city \u2014 check the spelling.';
      var MSG_NETWORK = 'Couldn\u2019t reach the weather service \u2014 please try again.';

      /* ---------- Weather icons (inline SVG, filled + line mix) ---------- */
      var CLOUD =
        '<g fill="currentColor">' +
          '<rect x="15" y="33" width="34" height="11" rx="5.5" />' +
          '<circle cx="26" cy="32" r="10" />' +
          '<circle cx="38" cy="28" r="13" />' +
        '</g>';

      var CLOUD_RAISED =
        '<g fill="currentColor">' +
          '<rect x="15" y="26" width="34" height="11" rx="5.5" />' +
          '<circle cx="26" cy="25" r="10" />' +
          '<circle cx="38" cy="21" r="13" />' +
        '</g>';

      var ICONS = {
        clear:
          '<svg viewBox="0 0 64 64">' +
            '<circle cx="32" cy="33" r="12" fill="currentColor" />' +
            '<g stroke="currentColor" stroke-width="4.5" stroke-linecap="round">' +
              '<path d="M32 8v6" /><path d="M32 52v6" /><path d="M8 33h6" /><path d="M50 33h6" />' +
              '<path d="M15 16l4 4" /><path d="M45 46l4 4" /><path d="M49 16l-4 4" /><path d="M19 46l-4 4" />' +
            '</g>' +
          '</svg>',

        partly:
          '<svg viewBox="0 0 64 64">' +
            '<circle cx="21" cy="19" r="8" fill="currentColor" />' +
            '<g stroke="currentColor" stroke-width="4" stroke-linecap="round">' +
              '<path d="M21 4v4" /><path d="M6 19h4" /><path d="M11 9l3 3" /><path d="M31 9l-3 3" />' +
            '</g>' +
            '<g fill="currentColor">' +
              '<rect x="17" y="39" width="34" height="11" rx="5.5" />' +
              '<circle cx="28" cy="38" r="10" />' +
              '<circle cx="40" cy="34" r="12.5" />' +
            '</g>' +
          '</svg>',

        overcast: '<svg viewBox="0 0 64 64">' + CLOUD + '</svg>',

        rain:
          '<svg viewBox="0 0 64 64">' +
            CLOUD_RAISED +
            '<g stroke="currentColor" stroke-width="4" stroke-linecap="round">' +
              '<path d="M25 44l-3 8" /><path d="M36 44l-3 8" /><path d="M47 44l-3 8" />' +
            '</g>' +
          '</svg>',

        drizzle:
          '<svg viewBox="0 0 64 64">' +
            CLOUD_RAISED +
            '<g fill="currentColor">' +
              '<circle cx="24" cy="46" r="2.6" /><circle cx="33" cy="52" r="2.6" />' +
              '<circle cx="42" cy="46" r="2.6" /><circle cx="51" cy="52" r="2.6" />' +
            '</g>' +
          '</svg>',

        thunder:
          '<svg viewBox="0 0 64 64">' +
            CLOUD_RAISED +
            '<path d="M36 40 L24 53 L32 53 L28 62 L42 47 L34 47 Z" fill="currentColor" />' +
          '</svg>',

        snow:
          '<svg viewBox="0 0 64 64">' +
            CLOUD_RAISED +
            '<g stroke="currentColor" stroke-width="3" stroke-linecap="round">' +
              '<path d="M24 44v8M20.5 46l7 4M27.5 46l-7 4" />' +
              '<path d="M40 50v8M36.5 52l7 4M43.5 52l-7 4" />' +
            '</g>' +
          '</svg>',

        fog:
          '<svg viewBox="0 0 64 64">' +
            CLOUD_RAISED +
            '<g stroke="currentColor" stroke-width="4.5" stroke-linecap="round">' +
              '<path d="M14 46h36" /><path d="M22 56h28" />' +
            '</g>' +
          '</svg>'
      };

      /* Map UAPI / QWeather-style icon codes to an icon key. */
      function iconKey(code) {
        var c = Number(code);
        if (!isFinite(c)) return 'overcast';
        if (c === 100 || c === 150 || c === 900) return 'clear';
        if (c === 101 || c === 102 || c === 103 || c === 151 || c === 152 || c === 153) return 'partly';
        if (c === 104 || c === 154) return 'overcast';
        if (c === 309) return 'drizzle';
        if (c === 302 || c === 303 || c === 304) return 'thunder';
        if (c >= 300 && c <= 399) return 'rain';
        if (c >= 400 && c <= 499) return 'snow';
        if (c >= 500 && c <= 599) return 'fog';
        return 'overcast';
      }

      /* ---------- Elements ---------- */
      var form = document.getElementById('search-form');
      var input = document.getElementById('city-input');
      var button = document.getElementById('search-btn');
      var statusEl = document.getElementById('status');
      var result = document.getElementById('result');
      var iconBox = document.getElementById('w-icon');
      var tempEl = document.getElementById('w-temp');
      var condEl = document.getElementById('w-cond');
      var cityEl = document.getElementById('w-city');
      var provEl = document.getElementById('w-prov');
      var metaEl = document.getElementById('w-meta');
      var footEl = document.getElementById('w-foot');

      function setStatus(state, message) {
        statusEl.className = 'status' + (state ? ' status--' + state : '');
        statusEl.textContent = message || '';
        if (state === 'loading') {
          statusEl.setAttribute('aria-busy', 'true');
        } else {
          statusEl.removeAttribute('aria-busy');
        }
      }

      function formatTemp(value) {
        var t = Number(value);
        if (!isFinite(t)) return '--';
        return Math.round(t * 10) / 10 === Math.round(t) ? String(Math.round(t)) : t.toFixed(1);
      }

      function chip(text) {
        var li = document.createElement('li');
        li.textContent = text;
        return li;
      }

      function render(data) {
        iconBox.innerHTML = ICONS[iconKey(data.weather_icon)] || ICONS.overcast;

        tempEl.innerHTML = '';
        tempEl.appendChild(document.createTextNode(formatTemp(data.temperature)));
        var unit = document.createElement('small');
        unit.textContent = '\u00B0C';
        tempEl.appendChild(unit);

        condEl.textContent = data.weather || '';
        cityEl.textContent = data.city || '';
        provEl.textContent =
          data.province && data.province !== data.city ? data.province : '';

        metaEl.innerHTML = '';
        if (data.humidity !== undefined && data.humidity !== null && data.humidity !== '') {
          metaEl.appendChild(chip('Humidity ' + data.humidity + '%'));
        }
        var wind = [data.wind_direction, data.wind_power].filter(Boolean).join(' ');
        if (wind) metaEl.appendChild(chip('Wind ' + wind));

        footEl.textContent = data.report_time ? 'Updated ' + data.report_time : '';

        result.classList.add('is-visible');
      }

      function search(city) {
        result.classList.remove('is-visible');
        metaEl.innerHTML = '';
        setStatus('loading', 'Loading\u2026');
        button.disabled = true;

        fetch(ENDPOINT + '?city=' + encodeURIComponent(city), {
          headers: { Accept: 'application/json' }
        })
          .then(function (response) {
            // 404 = city not found; 400 = invalid city input (e.g. digits/symbols).
            if (response.status === 404 || response.status === 400) throw { kind: 'notfound' };
            if (!response.ok) throw { kind: 'error' };
            return response.json();
          })
          .then(function (data) {
            if (!data || data.error) throw { kind: 'notfound' };
            setStatus('', '');
            render(data);
          })
          .catch(function (err) {
            setStatus('error', err && err.kind === 'notfound' ? MSG_NOT_FOUND : MSG_NETWORK);
          })
          .then(function () {
            button.disabled = false;
          });
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var city = input.value.trim();

        if (!city) {
          result.classList.remove('is-visible');
          setStatus('error', MSG_EMPTY);
          input.focus();
          return;
        }

        search(city);
      });
    })();
  </script>
</body>
</html>
