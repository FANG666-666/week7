<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanics Phenomena Visualized — Yuhao.Fang</title>
  <meta name="description" content="An interactive n-body gravity sandbox for a physics lesson: glowing worlds attract, collide and merge. Drag to slingshot planets, tune gravity and cosmic expansion, generate galaxy or binary-star systems." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(9, 15, 28, 0.78);
      --line: rgba(56, 189, 248, 0.28);
      --line-soft: rgba(56, 189, 248, 0.14);
      --cyan: #38bdf8;
      --violet: #c084fc;
      --text: #d9e7f7;
      --dim: #7d93ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Share Tech Mono", ui-monospace, Consolas, monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    /* ---------- Title bar ---------- */
    .titlebar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.8rem;
      padding: 0 1rem;
      background: linear-gradient(180deg, rgba(4,7,15,0.92), rgba(4,7,15,0.55) 72%, transparent);
      pointer-events: none;
    }
    .titlebar > * { pointer-events: auto; }

    .titlebar h1 {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: clamp(0.78rem, 2.6vw, 1.12rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 62vw;
      text-align: center;
    }

    .back {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      color: var(--cyan);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.42rem 0.85rem;
      background: rgba(9, 15, 28, 0.6);
      transition: box-shadow 0.15s ease, color 0.15s ease;
    }
    .back:hover { box-shadow: 0 0 14px rgba(56, 189, 248, 0.4); color: #bfe6ff; }

    .tb-right {
      justify-self: end;
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      color: var(--dim);
      white-space: nowrap;
    }

    /* ---------- Control panel (top-left) ---------- */
    .panel {
      position: fixed;
      top: 68px;
      left: 14px;
      z-index: 9;
      width: 250px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.12);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.85rem;
      cursor: pointer;
      user-select: none;
      font-family: "Orbitron", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      color: var(--cyan);
    }
    .panel-head .chev { transition: transform 0.2s ease; font-family: inherit; }
    .panel.collapsed .panel-body { display: none; }
    .panel.collapsed .chev { transform: rotate(-90deg); }

    .panel-body {
      padding: 0.3rem 0.85rem 0.85rem;
      border-top: 1px solid var(--line-soft);
      max-height: min(66vh, 540px);
      overflow: auto;
    }

    .ctl { margin-top: 0.7rem; }
    .ctl label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 0.28rem;
    }
    .ctl output { color: var(--cyan); font-size: 0.72rem; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 20px;
      background: transparent;
      cursor: pointer;
      --fill: 40%;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg,
        var(--cyan) 0%, var(--cyan) var(--fill),
        rgba(125, 147, 173, 0.28) var(--fill), rgba(125, 147, 173, 0.28) 100%);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      background: #e8f6ff;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }
    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: rgba(125, 147, 173, 0.28);
    }
    input[type="range"]::-moz-range-progress {
      height: 6px;
      border-radius: 999px;
      background: var(--cyan);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e8f6ff;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .toggles { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.9rem; }
    .switch {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--dim);
      cursor: pointer;
    }
    .switch input { accent-color: var(--cyan); width: 15px; height: 15px; cursor: pointer; }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.95rem;
    }
    .btn {
      font-family: "Share Tech Mono", monospace;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      padding: 0.5rem 0.4rem;
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.16); box-shadow: 0 0 12px rgba(56, 189, 248, 0.35); }
    .btn.scene { border-color: rgba(192, 132, 252, 0.42); color: #ecd5ff; }
    .btn.scene:hover { background: rgba(192, 132, 252, 0.12); box-shadow: 0 0 12px rgba(192, 132, 252, 0.35); }
    .btn.on { background: var(--cyan); border-color: var(--cyan); color: #03121f; }

    /* ---------- HUD overlays ---------- */
    .hud {
      position: fixed;
      z-index: 8;
      pointer-events: none;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
    }
    .count {
      top: 70px;
      right: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.42rem 0.9rem;
      color: var(--cyan);
      backdrop-filter: blur(8px);
    }
    .hint {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(125, 147, 173, 0.9);
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      max-width: 94vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 640px) {
      .panel { width: calc(100vw - 28px); }
      .tb-right { display: none; }
      .hint { font-size: 0.62rem; }
      .count { top: 64px; }
    }
  </style>
</head>
<body>

  <canvas id="space"></canvas>

  <header class="titlebar">
    <a class="back" href="projects.html">&#8592; Projects</a>
    <h1>Mechanics Phenomena Visualized</h1>
    <span class="tb-right">PHYSICS LESSON &middot; N-BODY GRAVITY</span>
  </header>

  <section class="panel" id="panel">
    <div class="panel-head" id="panel-head">
      <span>CONTROL PANEL</span>
      <span class="chev">&#9662;</span>
    </div>
    <div class="panel-body">
      <div class="ctl">
        <label>GRAVITY STRENGTH <output id="g-out">&times;1.00</output></label>
        <input type="range" id="g" min="0" max="250" value="100" />
      </div>
      <div class="ctl">
        <label>UNIVERSE EXPANSION <output id="e-out">0%</output></label>
        <input type="range" id="e" min="0" max="100" value="0" />
      </div>
      <div class="ctl">
        <label>NEW BODY MASS <output id="m-out">60</output></label>
        <input type="range" id="m" min="5" max="500" value="60" />
      </div>
      <div class="toggles">
        <label class="switch"><input type="checkbox" id="trails" checked /> Show motion trails</label>
        <label class="switch"><input type="checkbox" id="merge" checked /> Merge on collision</label>
      </div>
      <div class="btns">
        <button class="btn" id="pause" type="button">PAUSE</button>
        <button class="btn" id="clear" type="button">CLEAR</button>
        <button class="btn scene" id="galaxy" type="button">GALAXY</button>
        <button class="btn scene" id="binary" type="button">BINARY</button>
      </div>
    </div>
  </section>

  <div class="hud count" id="count">BODIES: 0</div>
  <div class="hud hint">Drag to launch a body &mdash; Click to place at rest &mdash; sliders tune G &amp; expansion</div>

  <script>
    (function () {
      'use strict';

      var canvas = document.getElementById('space');
      var ctx = canvas.getContext('2d');
      var countEl = document.getElementById('count');

      var W = 0, H = 0, DPR = 1;
      var G_BASE = 0.06;     // base gravitational constant
      var SOFT = 400;        // softening (px^2) to tame close encounters
      var VMAX = 18;         // speed cap (px/step)
      var CAP = 600;         // max bodies

      var bodies = [];
      var flashes = [];
      var stars = [];
      var paused = false;
      var showTrails = true;
      var mergeOn = true;
      var gravityMul = 1;
      var expansionRate = 0; // fraction per frame
      var newMass = 60;
      var lastCount = -1;

      /* ---------- sizing ---------- */
      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = '#04070f';
        ctx.fillRect(0, 0, W, H);
      }
      window.addEventListener('resize', resize);
      resize();

      for (var s = 0; s < 150; s++) {
        stars.push({
          x: Math.random(), y: Math.random(),
          r: Math.random() * 1.4 + 0.4,
          a: 0.06 + Math.random() * 0.3
        });
      }

      /* ---------- body model ---------- */
      function radius(m) { return 2.4 * Math.cbrt(m); }

      /* light mass -> bluish-white, heavy mass -> reddish (star-like stops) */
      var STOPS = [
        [0.00, 191, 224, 255],
        [0.35, 232, 240, 255],
        [0.70, 255, 205, 120],
        [1.00, 255, 92, 74]
      ];
      function colorOf(m) {
        var t = Math.log(m / 5) / Math.log(1000);
        t = Math.max(0, Math.min(1, t));
        var i = 0;
        while (i < STOPS.length - 2 && t > STOPS[i + 1][0]) i++;
        var a = STOPS[i], b = STOPS[i + 1];
        var k = (t - a[0]) / (b[0] - a[0]);
        return [
          Math.round(a[1] + (b[1] - a[1]) * k),
          Math.round(a[2] + (b[2] - a[2]) * k),
          Math.round(a[3] + (b[3] - a[3]) * k)
        ];
      }
      function colStr(c, a) {
        return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
      }

      function makeBody(x, y, vx, vy, m) {
        return { x: x, y: y, vx: vx, vy: vy, m: m, r: radius(m), col: colorOf(m), sprite: null, sprKey: '' };
      }

      /* cached glow sprite per body (redrawn when mass changes via merge) */
      function bodySprite(b) {
        var key = Math.round(b.r) + '_' + b.col.join(',');
        if (b.sprite && b.sprKey === key) return b.sprite;
        var R = Math.max(2, Math.ceil(b.r));
        var half = R * 3;
        var q = DPR;
        var c = document.createElement('canvas');
        c.width = c.height = Math.ceil(half * 2 * q);
        var g = c.getContext('2d');
        g.scale(q, q);
        var cx = half, cy = half;
        var glow = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, half);
        glow.addColorStop(0, colStr(b.col, 0.55));
        glow.addColorStop(0.45, colStr(b.col, 0.16));
        glow.addColorStop(1, colStr(b.col, 0));
        g.fillStyle = glow;
        g.fillRect(0, 0, half * 2, half * 2);
        var core = g.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
        core.addColorStop(0, colStr([Math.min(255, b.col[0] + 60), Math.min(255, b.col[1] + 60), Math.min(255, b.col[2] + 60)], 1));
        core.addColorStop(0.55, colStr(b.col, 1));
        core.addColorStop(1, colStr([Math.round(b.col[0] * 0.55), Math.round(b.col[1] * 0.5), Math.round(b.col[2] * 0.5)], 1));
        g.fillStyle = core;
        g.beginPath();
        g.arc(cx, cy, R, 0, 6.2832);
        g.fill();
        b.sprite = c;
        b.sprKey = key;
        return c;
      }

      /* ---------- physics ---------- */
      function physics(dt) {
        var n = bodies.length, i, j, a, b, dx, dy, d2, d, f;
        var ax = new Array(n), ay = new Array(n);
        for (i = 0; i < n; i++) { ax[i] = 0; ay[i] = 0; }
        var G = G_BASE * gravityMul;

        for (i = 0; i < n; i++) {
          a = bodies[i];
          for (j = i + 1; j < n; j++) {
            b = bodies[j];
            dx = b.x - a.x; dy = b.y - a.y;
            d2 = dx * dx + dy * dy + SOFT;
            d = Math.sqrt(d2);
            f = G / (d2 * d);
            ax[i] += f * b.m * dx; ay[i] += f * b.m * dy;
            ax[j] -= f * a.m * dx; ay[j] -= f * a.m * dy;
          }
        }

        var sp2, k;
        for (i = 0; i < n; i++) {
          a = bodies[i];
          a.vx += ax[i] * dt; a.vy += ay[i] * dt;
          sp2 = a.vx * a.vx + a.vy * a.vy;
          if (sp2 > VMAX * VMAX) { k = VMAX / Math.sqrt(sp2); a.vx *= k; a.vy *= k; }
          a.x += a.vx * dt; a.y += a.vy * dt;
        }

        if (mergeOn) {
          var big, small, M;
          for (i = 0; i < bodies.length; i++) {
            a = bodies[i];
            if (a.dead) continue;
            for (j = i + 1; j < bodies.length; j++) {
              b = bodies[j];
              if (b.dead) continue;
              dx = b.x - a.x; dy = b.y - a.y;
              var rr = (a.r + b.r) * 0.85;
              if (dx * dx + dy * dy < rr * rr) {
                M = a.m + b.m;
                big = a.m >= b.m ? a : b;
                small = big === a ? b : a;
                flashes.push({
                  x: (a.x * a.m + b.x * b.m) / M,
                  y: (a.y * a.m + b.y * b.m) / M,
                  r: big.r, col: big.col, life: 1
                });
                big.vx = (a.vx * a.m + b.vx * b.m) / M;
                big.vy = (a.vy * a.m + b.vy * b.m) / M;
                big.x = (a.x * a.m + b.x * b.m) / M;
                big.y = (a.y * a.m + b.y * b.m) / M;
                big.m = M;
                big.r = radius(M);
                big.col = colorOf(M);
                big.sprite = null;
                small.dead = true;
              }
            }
          }
          for (i = bodies.length - 1; i >= 0; i--) {
            if (bodies[i].dead) bodies.splice(i, 1);
          }
        }

        for (i = bodies.length - 1; i >= 0; i--) {
          a = bodies[i];
          if (a.x < -1500 || a.x > W + 1500 || a.y < -1500 || a.y > H + 1500) bodies.splice(i, 1);
        }
      }

      function applyExpansion() {
        if (expansionRate <= 0) return;
        var cx = W / 2, cy = H / 2, s = 1 + expansionRate;
        for (var i = 0; i < bodies.length; i++) {
          var b = bodies[i];
          b.x = cx + (b.x - cx) * s;
          b.y = cy + (b.y - cy) * s;
        }
      }

      /* ---------- rendering ---------- */
      function render() {
        ctx.fillStyle = (showTrails && !paused) ? 'rgba(4,7,15,0.22)' : '#04070f';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#9fc6ff';
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          ctx.globalAlpha = st.a;
          ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
        }
        ctx.globalAlpha = 1;

        for (i = 0; i < bodies.length; i++) {
          var b = bodies[i];
          var spr = bodySprite(b);
          var half = spr.width / (2 * DPR);
          ctx.drawImage(spr, b.x - half, b.y - half, half * 2, half * 2);
        }

        for (i = flashes.length - 1; i >= 0; i--) {
          var f = flashes[i];
          f.life -= 0.05;
          if (f.life <= 0) { flashes.splice(i, 1); continue; }
          var rr = f.r * (1 + (1 - f.life) * 3);
          ctx.strokeStyle = colStr(f.col, f.life * 0.8);
          ctx.lineWidth = 0.5 + 2 * f.life;
          ctx.beginPath();
          ctx.arc(f.x, f.y, rr, 0, 6.2832);
          ctx.stroke();
        }

        drawDrag();
      }

      /* ---------- slingshot drag ---------- */
      var drag = null;

      canvas.addEventListener('pointerdown', function (e) {
        drag = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY };
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      });
      canvas.addEventListener('pointermove', function (e) {
        if (drag) { drag.x1 = e.clientX; drag.y1 = e.clientY; }
      });
      canvas.addEventListener('pointerup', function (e) {
        if (!drag) return;
        drag.x1 = e.clientX; drag.y1 = e.clientY;
        var dx = drag.x0 - drag.x1, dy = drag.y0 - drag.y1;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < 6) {
          spawn(drag.x0, drag.y0, 0, 0);            /* click = place at rest */
        } else {
          var K = 0.085, vx = dx * K, vy = dy * K;  /* slingshot: flies opposite the pull */
          var sp = Math.sqrt(vx * vx + vy * vy);
          if (sp > 16) { vx *= 16 / sp; vy *= 16 / sp; }
          spawn(drag.x0, drag.y0, vx, vy);
        }
        drag = null;
      });
      canvas.addEventListener('pointercancel', function () { drag = null; });

      function spawn(x, y, vx, vy) {
        if (bodies.length >= CAP) bodies.shift();
        bodies.push(makeBody(x, y, vx, vy, newMass));
        updateCount();
      }

      function drawDrag() {
        if (!drag) return;
        var r = radius(newMass);
        ctx.save();
        ctx.setLineDash([5, 6]);
        ctx.strokeStyle = 'rgba(56,189,248,0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(drag.x0, drag.y0);
        ctx.lineTo(drag.x1, drag.y1);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(217,231,247,0.85)';
        ctx.beginPath();
        ctx.arc(drag.x0, drag.y0, r, 0, 6.2832);
        ctx.stroke();

        var dx = drag.x0 - drag.x1, dy = drag.y0 - drag.y1;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > 6) {
          var ux = dx / d, uy = dy / d, L = Math.min(d, 140);
          var ex = drag.x0 + ux * L, ey = drag.y0 + uy * L;
          var ang = Math.atan2(uy, ux);
          ctx.strokeStyle = 'rgba(56,189,248,0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(drag.x0 + ux * r, drag.y0 + uy * r);
          ctx.lineTo(ex, ey);
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex - 10 * Math.cos(ang - 0.4), ey - 10 * Math.sin(ang - 0.4));
          ctx.moveTo(ex, ey);
          ctx.lineTo(ex - 10 * Math.cos(ang + 0.4), ey - 10 * Math.sin(ang + 0.4));
          ctx.stroke();
        }
        ctx.restore();
      }

      /* ---------- scenes ---------- */
      function clearAll() {
        bodies.length = 0;
        flashes.length = 0;
        drag = null;
        ctx.fillStyle = '#04070f';
        ctx.fillRect(0, 0, W, H);
        updateCount();
      }

      function galaxy() {
        clearAll();
        var M = 8000, cx = W / 2, cy = H / 2;
        bodies.push(makeBody(cx, cy, 0, 0, M));
        var n = 110, Rmax = Math.min(W, H) * 0.46;
        for (var i = 0; i < n; i++) {
          var ang = Math.random() * 6.2832;
          var rad = 70 + Math.pow(Math.random(), 0.7) * (Rmax - 70);
          var m = 6 + Math.random() * Math.random() * 90;
          var v = Math.sqrt(G_BASE * gravityMul * M / rad) * (0.92 + Math.random() * 0.16);
          bodies.push(makeBody(
            cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad,
            -Math.sin(ang) * v, Math.cos(ang) * v, m
          ));
        }
      }

      function binary() {
        clearAll();
        var m = 4500, d = Math.min(W, H) * 0.28, cx = W / 2, cy = H / 2;
        var v = Math.sqrt(G_BASE * gravityMul * m / (2 * d));
        bodies.push(makeBody(cx - d / 2, cy, 0, -v, m));
        bodies.push(makeBody(cx + d / 2, cy, 0, v, m));
        var n = 70, inner = d * 1.15, Rmax = Math.min(W, H) * 0.5;
        for (var i = 0; i < n; i++) {
          var ang = Math.random() * 6.2832;
          var rad = inner + Math.random() * (Rmax - inner);
          var mm = 4 + Math.random() * 22;
          var vv = Math.sqrt(G_BASE * gravityMul * 2 * m / rad) * (0.95 + Math.random() * 0.1);
          bodies.push(makeBody(
            cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad,
            -Math.sin(ang) * vv, Math.cos(ang) * vv, mm
          ));
        }
      }

      /* ---------- panel wiring ---------- */
      var panel = document.getElementById('panel');
      document.getElementById('panel-head').addEventListener('click', function () {
        panel.classList.toggle('collapsed');
      });
      if (window.innerWidth < 640) panel.classList.add('collapsed');

      var gIn = document.getElementById('g'), gOut = document.getElementById('g-out');
      var eIn = document.getElementById('e'), eOut = document.getElementById('e-out');
      var mIn = document.getElementById('m'), mOut = document.getElementById('m-out');

      gIn.addEventListener('input', function () {
        gravityMul = gIn.value / 100;
        gOut.textContent = '\u00d7' + gravityMul.toFixed(2);
      });
      eIn.addEventListener('input', function () {
        expansionRate = eIn.value * 0.00006;
        eOut.textContent = eIn.value + '%';
      });
      mIn.addEventListener('input', function () {
        newMass = +mIn.value;
        mOut.textContent = mIn.value;
      });

      document.getElementById('trails').addEventListener('change', function () {
        showTrails = this.checked;
      });
      document.getElementById('merge').addEventListener('change', function () {
        mergeOn = this.checked;
      });

      var pauseBtn = document.getElementById('pause');
      function setPaused(p) {
        paused = p;
        pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
        pauseBtn.classList.toggle('on', paused);
      }
      pauseBtn.addEventListener('click', function () { setPaused(!paused); });
      document.getElementById('clear').addEventListener('click', clearAll);
      document.getElementById('galaxy').addEventListener('click', function () { setPaused(false); galaxy(); });
      document.getElementById('binary').addEventListener('click', function () { setPaused(false); binary(); });

      /* ---------- main loop (Galaxy auto-start) ---------- */
      function updateCount() {
        if (bodies.length !== lastCount) {
          lastCount = bodies.length;
          countEl.textContent = 'BODIES: ' + lastCount;
        }
      }

      function tick() {
        lastTick = Date.now();
        if (!paused) {
          physics(1);
          applyExpansion();
        }
        render();
        updateCount();
      }

      /* rAF drives the animation; a watchdog keeps physics + rendering alive
         when rAF is frozen (hidden tab / some automated contexts). */
      var lastTick = Date.now();
      (function rafLoop() {
        requestAnimationFrame(function () { tick(); rafLoop(); });
      })();
      setInterval(function () {
        if (Date.now() - lastTick > 250) tick();
      }, 32);

      galaxy();
      updateCount();
    })();
  </script>
</body>
</html>
